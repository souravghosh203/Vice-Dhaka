function collidesWithBuilding(x,z,radius=1.9){for(const b of window.__dhakaLots||[]){const minX=b.x-b.w/2,maxX=b.x+b.w/2,minZ=b.z-b.d/2,maxZ=b.z+b.d/2,cx=Math.max(minX,Math.min(maxX,x)),cz=Math.max(minZ,Math.min(maxZ,z)),dx=x-cx,dz=z-cz;if(dx*dx+dz*dz<radius*radius)return true}return false}
function useVehicle(){if(player.inVehicle){const v=player.vehicle,sideX=Math.cos(player.yaw)*4,sideZ=-Math.sin(player.yaw)*4;let ex=player.x+sideX,ez=player.z+sideZ;if(collidesWithBuilding(ex,ez,.7)){ex=player.x-sideX;ez=player.z-sideZ}v.mesh.remove(player.avatar);if(player.avatar.parent!==world)world.add(player.avatar);player.avatar.scale.set(1,1,1);player.x=ex;player.z=ez;player.speed=0;player.inVehicle=false;player.vehicle=null;player.mesh=player.avatar;player.avatar.visible=true;player.avatar.position.set(ex,0,ez);player.avatar.rotation.y=player.yaw;player.avatar.userData.arms.forEach(a=>a.rotation.x=0);player.avatar.userData.legs.forEach(l=>l.rotation.x=0);v.occupied=false;v.speed=0;say('On foot · '+v.type+' parked nearby');return}let nearest=null,dist=Infinity;for(const v of vehicles){if(v.occupied)continue;const d=Math.hypot(v.x-player.x,v.z-player.z);if(d<dist){dist=d;nearest=v}}if(!nearest||dist>12){say('Move closer to a parked vehicle · press E');return}player.vehicle=nearest;player.inVehicle=true;nearest.occupied=true;nearest.speed=0;player.x=nearest.x;player.z=nearest.z;player.yaw=nearest.yaw;player.speed=0;player.mesh=nearest.mesh;if(nearest.type==='rickshaw'){player.avatar.visible=false}else{world.remove(player.avatar);nearest.mesh.add(player.avatar);player.avatar.visible=true;player.avatar.scale.setScalar(nearest.type==='car'||nearest.type==='sports' ? .55 : .66);player.avatar.position.set(0,.34,-.3);player.avatar.rotation.y=0;player.avatar.userData.arms.forEach(a=>a.rotation.x=-.75)}say('Driving · '+nearest.type.toUpperCase()+' · E to exit')}function startAttack(kind){if(player.inVehicle)return;if(player.attack&&player.attack.time<player.attack.duration)return;const duration=kind==='kick'?.68:.48;player.attack={kind,time:0,duration};const range=kind==='kick'?3.0:2.3,fx=Math.sin(player.yaw),fz=Math.cos(player.yaw);let target=null,best=range;for(const npc of pedestrians){if(npc.userData.stun>0)continue;const dx=npc.position.x-player.x,dz=npc.position.z-player.z,d=Math.hypot(dx,dz),dot=(dx*fx+dz*fz)/(d||1);if(d<best&&dot>.1){target=npc;best=d}}if(target){target.userData.health--;target.userData.stun=.7;target.position.x+=fx*1.25;target.position.z+=fz*1.25;target.rotation.y=Math.atan2(-fx,-fz);if(target.userData.health<=0){target.userData.stun=2.8;target.userData.health=3}say(kind==='kick'?'Kick landed':'Punch landed')}else say(kind==='kick'?'Kick · no one in range':'Punch · no one in range')}
function collidesWithParked(x,z,radius,ignore=null){for(const v of vehicles){if(v===ignore||v.occupied)continue;const r=v.type==='car'||v.type==='sports'?3:v.type==='rickshaw'?2:1.2;if(Math.hypot(x-v.x,z-v.z)<radius+r)return true}return false}
function update(dt){const fwd=keys.arrowup||keys.w||keys.gas,back=keys.arrowdown||keys.s||keys.brake,left=keys.arrowleft||keys.a||keys.left,right=keys.arrowright||keys.d||keys.right,hand=keys[' '],sprint=keys.shift;if(player.inVehicle){const v=player.vehicle,targetSpeed=fwd?v.maxSpeed:back?-v.maxSpeed*.32:0,accel=back&&player.speed>0?20:v.accel,vehicleRadius=v.type==='car'||v.type==='sports'?3:v.type==='rickshaw'?2.2:1.25;player.speed+=(targetSpeed-player.speed)*Math.min(1,dt*(fwd||back?accel:2.2));if(hand)player.speed*=Math.pow(.68,dt*60);player.speed=Math.max(-v.maxSpeed*.35,Math.min(v.maxSpeed,player.speed));const steer=(left?1:0)-(right?1:0);player.yaw+=steer*Math.sign(player.speed||1)*dt*v.turn*(.35+Math.min(v.maxSpeed,Math.abs(player.speed))*.045);const nx=player.x+Math.sin(player.yaw)*player.speed*dt,nz=player.z+Math.cos(player.yaw)*player.speed*dt;let moved=false;if(Math.abs(nx)<HALF-8&&!collidesWithBuilding(nx,player.z,vehicleRadius)&&!collidesWithParked(nx,player.z,vehicleRadius,v)){player.x=nx;moved=true}if(Math.abs(nz)<HALF-8&&!collidesWithBuilding(player.x,nz,vehicleRadius)&&!collidesWithParked(player.x,nz,vehicleRadius,v)){player.z=nz;moved=true}if(!moved&&(Math.abs(nx-player.x)+Math.abs(nz-player.z)>.001)){player.speed*=-.12;if(player.hitCooldown<=0){damage(.8);player.hitCooldown=.6}}}else{const turn=(right?1:0)-(left?1:0);player.yaw+=turn*dt*2.35;const targetSpeed=fwd?(sprint?6.2:3.1):back?-(sprint?4.1:2.1):0;player.speed+=(targetSpeed-player.speed)*Math.min(1,dt*(fwd||back?7:8));const nx=player.x+Math.sin(player.yaw)*player.speed*dt,nz=player.z+Math.cos(player.yaw)*player.speed*dt;if(Math.abs(nx)<HALF-4&&!collidesWithBuilding(nx,player.z,.65)&&!collidesWithParked(nx,player.z,.65)){player.x=nx}else player.speed=0;if(Math.abs(nz)<HALF-4&&!collidesWithBuilding(player.x,nz,.65)&&!collidesWithParked(player.x,nz,.65)){player.z=nz}else player.speed=0;if(player.jumpVelocity){player.jump+=player.jumpVelocity*dt;player.jumpVelocity-=12*dt;if(player.jump<=0){player.jump=0;player.jumpVelocity=0}}const moving=Math.abs(player.speed)>.25,phase=elapsed*(sprint?12:8);player.avatar.position.set(player.x,player.jump+(moving?Math.abs(Math.sin(phase))*.05:0),player.z);player.avatar.rotation.y=player.yaw;const pose=player.avatar.userData,attack=player.attack;if(attack){attack.time+=dt;const p=Math.min(1,attack.time/attack.duration),swing=Math.sin(p*Math.PI);if(attack.kind==='punch'){pose.arms[1].rotation.x=-swing*1.45;pose.arms[0].rotation.x=-swing*.25}else{pose.arms[1].rotation.x=-swing*.45;pose.legs[1].rotation.x=-swing*1.15}if(attack.time>=attack.duration){pose.arms.forEach(a=>a.rotation.x=0);pose.legs.forEach(a=>a.rotation.x=0);player.attack=null}}else{pose.arms.forEach((a,i)=>a.rotation.x=moving?Math.sin(phase+(i*Math.PI))*Math.min(.65,Math.abs(player.speed)*.12):0);pose.legs.forEach((l,i)=>l.rotation.x=moving?Math.sin(phase+(i*Math.PI))*Math.min(.72,Math.abs(player.speed)*.14):0)}}player.hitCooldown=Math.max(0,player.hitCooldown-dt);for(const npc of pedestrians){const data=npc.userData;if(data.stun>0){data.stun=Math.max(0,data.stun-dt);npc.position.y=-Math.sin((.7-data.stun)*Math.PI/.7)*.65}else{npc.position.y=Math.sin(elapsed*1.8+data.phase)*.035}}for(const t of traffic){if(!t.cruiseSpeed)t.cruiseSpeed=t.speed;const trafficAlong=t.axis==='x'?player.x:player.z,trafficCross=t.axis==='x'?player.z:player.x,ahead=(trafficAlong-t.p)*t.dir,nearLane=Math.abs(trafficCross-t.lane)<12,gap=Math.abs(ahead),desired=nearLane?(gap<12?0:gap<34?t.cruiseSpeed*gap/34:t.cruiseSpeed):t.cruiseSpeed,desiredAvoid=nearLane&&gap<24?(trafficCross>=t.lane?-6:6):0;t.avoid=(t.avoid||0)+(desiredAvoid-(t.avoid||0))*Math.min(1,dt*2);t.speed+=(desired-t.speed)*Math.min(1,dt*3);t.p+=t.dir*t.speed*dt;if(t.p>HALF)t.p=-HALF;if(t.p< -HALF)t.p=HALF;t.pushX*=Math.exp(-3.5*dt);t.pushZ*=Math.exp(-3.5*dt);const bx=t.axis==='x'?t.p:t.lane,bz=t.axis==='z'?t.p:t.lane,cx=bx+t.pushX+(t.axis==='z'?t.avoid:0),cz=bz+t.pushZ+(t.axis==='x'?t.avoid:0);t.g.position.set(cx,0,cz);t.g.rotation.y=t.axis==='x'?(t.dir>0?Math.PI/2:-Math.PI/2):(t.dir>0?0:Math.PI);t.hitCooldown=Math.max(0,t.hitCooldown-dt);const dx=player.x-cx,dz=player.z-cz,dist=Math.hypot(dx,dz),radius=t.radius+(player.inVehicle?2.25:.65);if(dist<radius){const nx=dist>.001?dx/dist:1,nz=dist>.001?dz/dist:0,overlap=radius-dist;player.x+=nx*Math.min(overlap*.28,.65);player.z+=nz*Math.min(overlap*.28,.65);if(t.hitCooldown<=0){const impactSpeed=Math.abs(player.speed),impulse=Math.min(1.8,impactSpeed*.12);t.pushX-=nx*impulse;t.pushZ-=nz*impulse;t.speed=0;player.speed*=-.04;if(impactSpeed>6&&player.hitCooldown<=0){damage(Math.min(2,.5+impactSpeed*.05));player.hitCooldown=1.2}t.hitCooldown=1.35}}}if(player.inVehicle){const v=player.vehicle;v.x=player.x;v.z=player.z;v.yaw=player.yaw;v.speed=player.speed;v.mesh.position.set(player.x,Math.sin(elapsed*9)*.035,player.z);v.mesh.rotation.y=player.yaw}else{player.avatar.position.x=player.x;player.avatar.position.z=player.z}if(heat>1&&Math.random()<.002*dt*60)heat=Math.max(0,heat-.01);if(heat>2&&Math.random()<.003*dt*60)say('Traffic police are watching!');fare.time+=dt;const goal=fare.stage?fare.b:fare.a;if(Math.hypot(player.x-goal.x,player.z-goal.z)<20){if(!fare.stage){fare.stage=1;marker.position.set(fare.b.x,1,fare.b.z);marker.material.color.set(0xff3ea5);markerBeam.material.color.set(0xff3ea5);fare.time=0;say(fare.type+' · Continue to '+fare.b.name)}else{const bonus=Math.max(0,Math.round((fare.limit-fare.time)*.8));score+=fare.pay+bonus;health=Math.min(100,health+8);localStorage.setItem('vdh-score',Math.max(score,Number(localStorage.getItem('vdh-score')||0)));say('Fare complete · +৳ '+(fare.pay+bonus));newFare()}}else if(fare.time>fare.limit){say('Fare expired · passenger found another ride');newFare()}if(waypoint)marker.position.set(waypoint.x,1,waypoint.z);weatherClock+=dt;if(audioCtx&&audioOn)engineOsc.frequency.setTargetAtTime(46+Math.abs(player.speed)*3,audioCtx.currentTime,.08);updateCamera(dt);hudTimer+=dt;if(hudTimer>=.1){hudTimer=0;updateHud();drawMini()}}function damage(n){health-=n;heat=Math.min(5,heat+n*.04);if(health<=0){health=75;if(player.inVehicle){player.vehicle.occupied=false;if(player.avatar.parent===player.vehicle.mesh){player.vehicle.mesh.remove(player.avatar);world.add(player.avatar);player.avatar.scale.set(1,1,1)}player.vehicle=null;player.inVehicle=false}player.mesh=player.avatar;player.avatar.visible=true;player.x=90;player.z=82;player.speed=0;player.avatar.position.set(player.x,0,player.z);score=Math.max(0,score-50);say('Recovered at the Dhaka clinic · ৳50 fee');updateHud()}}function updateCamera(dt){const pos=player.mesh.position,yaw=player.yaw;if(mode===0){const forward=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw)),right=new THREE.Vector3(forward.z,0,-forward.x);const target=new THREE.Vector3(pos.x-forward.x*9.5+right.x*1.8,pos.y+4.5,pos.z-forward.z*9.5+right.z*1.8);camera.position.lerp(target,1-Math.exp(-5*dt));camera.lookAt(pos.x+forward.x*3.1,1.8,pos.z+forward.z*3.1)}else if(mode===1){camera.position.set(pos.x+Math.sin(yaw)*.4,player.inVehicle?2.5:pos.y+1.62,pos.z+Math.cos(yaw)*.4);camera.rotation.set(0,yaw+Math.PI,0)}else{camera.position.lerp(new THREE.Vector3(pos.x,90,pos.z+.01),.12);camera.lookAt(pos.x,0,pos.z);camera.rotation.z=0}}function drawMini(){const c=$('mini'),x=c.getContext('2d'),w=c.width;x.clearRect(0,0,w,w);x.save();x.translate(w/2,w/2);x.rotate(-player.yaw);const scale=w/WORLD*1.9;x.fillStyle='#292538';x.fillRect(-w,-w,2*w,2*w);x.strokeStyle='#d9a74d';x.lineWidth=2;for(let i=0;i<=SIZE;i++){const p=(i*CHUNK-HALF-player.x)*scale;x.beginPath();x.moveTo(p,-w);x.lineTo(p,w);x.stroke();x.beginPath();x.moveTo(-w,p);x.lineTo(w,p);x.stroke()}traffic.forEach(t=>{x.fillStyle='#ff814d';x.fillRect((t.g.position.x-player.x)*scale-2,(t.g.position.z-player.z)*scale-2,4,4)});const goal=fare.stage?fare.b:fare.a;x.fillStyle='#27e5ff';x.beginPath();x.arc((goal.x-player.x)*scale,(goal.z-player.z)*scale,5,0,7);x.fill();x.fillStyle='#ffd23f';x.beginPath();x.moveTo(0,7);x.lineTo(5,-6);x.lineTo(0,-3);x.lineTo(-5,-6);x.fill();x.restore()}
function drawMap(){const c=$('map'),x=c.getContext('2d'),s=c.width;x.fillStyle='#171024';x.fillRect(0,0,s,s);for(let i=0;i<=SIZE;i++){const p=i*CHUNK/WORLD*s;x.strokeStyle='#d3926a';x.lineWidth=8;x.beginPath();x.moveTo(p,0);x.lineTo(p,s);x.moveTo(0,p);x.lineTo(s,p);x.stroke()}x.fillStyle='#116c82';x.fillRect(s*.78,0,s*.08,s);landmarks.forEach((l,i)=>{const px=(l.x+HALF)/WORLD*s,py=(l.z+HALF)/WORLD*s;x.fillStyle='#27e5ff';x.beginPath();x.arc(px,py,9,0,7);x.fill();x.fillStyle='#fff';x.font='16px system-ui';x.fillText(l.name,px+11,py-8)});const px=(player.x+HALF)/WORLD*s,py=(player.z+HALF)/WORLD*s;x.fillStyle='#ffd23f';x.beginPath();x.arc(px,py,10,0,7);x.fill();if(waypoint){x.strokeStyle='#ff3ea5';x.setLineDash([8,8]);x.lineWidth=3;x.beginPath();x.moveTo(px,py);x.lineTo((waypoint.x+HALF)/WORLD*s,(waypoint.z+HALF)/WORLD*s);x.stroke();x.setLineDash([])}}function mapClick(e){const r=e.currentTarget.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,z=(e.clientY-r.top)/r.height;waypoint={x:x*WORLD-HALF,z:z*WORLD-HALF};say('Waypoint set');drawMap()}function mapTouch(e){if(e.changedTouches.length){const t=e.changedTouches[0],r=e.currentTarget.getBoundingClientRect();waypoint={x:(t.clientX-r.left)/r.width*WORLD-HALF,z:(t.clientY-r.top)/r.height*WORLD-HALF};drawMap()}}
